name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Real-browser check (Chrome)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Serve the production build
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "preview server did not start" && exit 1

      # Google Chrome is preinstalled on GitHub's Ubuntu runners
      - name: Play the game in headless Chrome
        run: npm run test:e2e -- http://localhost:4173/ e2e-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
